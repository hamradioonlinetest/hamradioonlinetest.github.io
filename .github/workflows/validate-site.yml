name: Validate site

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate public cache restore with actions/cache v6
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/hamstudy-sessions.json
            .cache/hamstudy-sandarc-sessions.json
            .cache/sitemap-state.json
          key: public-site-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: public-site-v2-
      - name: Build and validate site without deployment
        run: ./scripts/build-site.sh
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install headless Chromium for responsive checks
        run: npx playwright install --with-deps chromium
      - name: Browser viewport and accessibility smoke tests
        run: node scripts/test-responsive-browser.mjs _site
      - name: Preserve responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots
          path: .browser-audit/
          if-no-files-found: ignore
